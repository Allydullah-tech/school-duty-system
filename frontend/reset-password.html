<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — SchoolDuty</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:wght@600;700&family=DM+Mono:wght@400&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0a0e1a;--bg2:#111827;--bg3:#1a2235;--border:#2a3a52;--text:#e8eef7;--text2:#8fa3bf;--text3:#5a7290;--accent:#f5a623;--green:#34d399;--red:#f87171;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background-image:radial-gradient(ellipse 60% 50% at 20% 20%,rgba(245,166,35,.05) 0%,transparent 60%);}
    .card{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:40px;width:100%;max-width:430px;box-shadow:0 24px 48px rgba(0,0,0,.4);}
    .logo{text-align:center;margin-bottom:28px;}
    .logo-icon{width:52px;height:52px;background:linear-gradient(135deg,var(--accent),#e8941a);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;color:#fff;margin-bottom:12px;box-shadow:0 8px 20px rgba(245,166,35,.3);}
    h1{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;color:var(--text);margin-bottom:4px;}
    .sub{color:var(--text2);font-size:.8rem;}
    .step{display:none;} .step.active{display:block;animation:fadeUp .3s ease;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .step-indicator{display:flex;justify-content:center;gap:32px;margin-bottom:26px;}
    .step-item{text-align:center;}
    .step-dot{width:34px;height:34px;background:var(--bg3);border:2px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text3);font-weight:600;font-size:.85rem;margin:0 auto 5px;}
    .step-dot.active{border-color:var(--accent);background:var(--accent);color:#fff;}
    .step-dot.done{border-color:var(--green);background:var(--green);color:#fff;}
    .step-lbl{font-size:.65rem;color:var(--text3);}
    .form-group{margin-bottom:16px;}
    label{display:block;font-size:.7rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;}
    input{width:100%;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.88rem;outline:none;transition:border-color .2s,box-shadow .2s;}
    input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(245,166,35,.12);}
    .btn{width:100%;padding:11px;background:linear-gradient(135deg,var(--accent),#e8941a);color:#fff;border:none;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s;margin-bottom:8px;}
    .btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(245,166,35,.3);}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
    .btn-sec{background:var(--bg3);border:1px solid var(--border);color:var(--text2);}
    .alert{padding:11px 14px;border-radius:9px;font-size:.8rem;margin-bottom:16px;}
    .alert-error{background:rgba(248,113,113,.1);color:#fca5a5;border-left:3px solid var(--red);}
    .alert-success{background:rgba(52,211,153,.1);color:#6ee7b7;border-left:3px solid var(--green);}
    .q-box{background:rgba(245,166,35,.08);padding:14px;border-radius:9px;margin:12px 0;border:1px solid rgba(245,166,35,.2);}
    .q-text{color:var(--accent);font-weight:600;font-size:.88rem;}
    .back-link{text-align:center;margin-top:16px;font-size:.78rem;color:var(--text3);}
    .back-link a{color:var(--accent);text-decoration:none;}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">S</div>
    <h1>Reset Password</h1>
    <p class="sub">Recover your admin account — 3 steps</p>
  </div>

  <div class="step-indicator">
    <div class="step-item"><div class="step-dot" id="dot1">1</div><div class="step-lbl">Email</div></div>
    <div class="step-item"><div class="step-dot" id="dot2">2</div><div class="step-lbl">Security</div></div>
    <div class="step-item"><div class="step-dot" id="dot3">3</div><div class="step-lbl">Reset</div></div>
  </div>

  <div id="alertBox"></div>

  <div id="step1" class="step active">
    <div class="form-group"><label>Admin Email Address</label><input type="email" id="email" placeholder="admin@school.com"/></div>
    <button class="btn" onclick="step1()">Continue →</button>
    <div class="back-link"><a href="login.html">← Back to Login</a></div>
  </div>

  <div id="step2" class="step">
    <div class="q-box"><div class="q-text" id="secQ"></div></div>
    <div class="form-group"><label>Your Answer</label><input type="text" id="answer" placeholder="Enter your answer"/></div>
    <button class="btn" onclick="step2()">Verify →</button>
    <button class="btn btn-sec" onclick="goTo(1)">← Back</button>
  </div>

  <div id="step3" class="step">
    <div class="form-group"><label>New Password (min 6 chars)</label><input type="password" id="newPass" placeholder="••••••••"/></div>
    <div class="form-group"><label>Confirm Password</label><input type="password" id="confirmPass" placeholder="••••••••"/></div>
    <button class="btn" onclick="step3()">Reset Password →</button>
    <button class="btn btn-sec" onclick="goTo(2)">← Back</button>
  </div>
</div>

<script>
  const API='/school-duty-system/backend/auth/reset_password.php';
  let adminId=null,resetToken=null;

  function dots(s){
    [1,2,3].forEach(i=>{
      const d=document.getElementById('dot'+i);
      d.className='step-dot'+(i<s?' done':i===s?' active':'');
    });
  }

  function alert2(msg,type){
    const b=document.getElementById('alertBox');
    b.innerHTML=`<div class="alert alert-${type}">${msg}</div>`;
    setTimeout(()=>b.innerHTML='',5000);
  }

  function goTo(n){
    [1,2,3].forEach(i=>document.getElementById('step'+i).classList.remove('active'));
    document.getElementById('step'+n).classList.add('active');
    dots(n);
    document.getElementById('alertBox').innerHTML='';
  }

  async function step1(){
    const email=document.getElementById('email').value.trim();
    if(!email){alert2('Please enter email','error');return;}
    try{
      const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'check_email',email})});
      const d=await res.json();
      if(!res.ok)throw new Error(d.error);
      adminId=d.admin_id;
      document.getElementById('secQ').textContent=d.security_question;
      goTo(2);alert2('Email verified! Answer your security question.','success');
    }catch(err){alert2(err.message,'error');}
  }

  async function step2(){
    const answer=document.getElementById('answer').value.trim();
    if(!answer){alert2('Please enter your answer','error');return;}
    try{
      const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'verify_answer',admin_id:adminId,answer})});
      const d=await res.json();
      if(!res.ok)throw new Error(d.error);
      resetToken=d.reset_token;
      goTo(3);alert2('Answer verified! Set your new password.','success');
    }catch(err){alert2(err.message,'error');}
  }

  async function step3(){
    const np=document.getElementById('newPass').value,cp=document.getElementById('confirmPass').value;
    if(!np||!cp){alert2('Fill both fields','error');return;}
    if(np.length<6){alert2('Min 6 characters','error');return;}
    if(np!==cp){alert2('Passwords do not match','error');return;}
    if(!resetToken){alert2('Session expired, start over','error');goTo(1);return;}
    try{
      const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'reset_password',reset_token:resetToken,new_password:np})});
      const d=await res.json();
      if(!res.ok)throw new Error(d.error);
      alert2('✅ Password reset! Redirecting…','success');
      setTimeout(()=>window.location.href='login.html',2000);
    }catch(err){alert2(err.message,'error');}
  }
</script>
</body>
</html>
